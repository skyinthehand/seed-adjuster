name = "seed-adjuster-control-plane"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Free plan only — no billing account is attached to this Cloudflare account.
# Exceeding free-tier limits must fail closed (errors), never silently upgrade to paid usage.
# See research.md #0 and #3.

[[d1_databases]]
binding = "DB"
database_name = "seed-adjuster"
database_id = "1ebc3832-7083-4363-acb3-50a66da3f47f"

[vars]
# CORS allow-list for the GitHub Pages origin. Override per-environment via `wrangler.toml` env sections
# or `wrangler secret`/`vars` at deploy time.
ALLOWED_ORIGIN = "https://skyinthehand.github.io/seed-adjuster/"
