name: Build match-history index

# Public repository → free, unlimited Actions minutes (research.md #0). No user credentials
# are involved in this workflow (research.md #2).

on:
  schedule:
    - cron: "0 18 * * *" # daily, 03:00 JST
  workflow_dispatch: {}

permissions:
  contents: write # to force-push the published-index branch

jobs:
  build-index:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m src.build_index --out-dir dist
      - name: Publish index to the published-index branch
        env:
          # GitHub Releases assets don't support CORS (no Access-Control-Allow-Origin on
          # release-assets.githubusercontent.com), so the browser frontend can't fetch them
          # directly. raw.githubusercontent.com does support CORS, so the index is pushed to
          # a dedicated branch instead. Every run is a full rebuild (research.md #2), and this
          # branch's only purpose is serving the latest snapshot, so each run force-pushes a
          # single fresh commit rather than accumulating history — this branch's git history
          # is disposable by design; never merge it into main or treat prior commits as durable.
          PARQUET_URL: https://raw.githubusercontent.com/${{ github.repository }}/published-index/match-index.parquet
        run: |
          set -euo pipefail
          python scripts/set_manifest_parquet_url.py "$PARQUET_URL"

          publish_dir="$(mktemp -d)"
          cp dist/match-index.parquet dist/manifest.json "$publish_dir"/
          cd "$publish_dir"
          git init -q -b published-index
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add match-index.parquet manifest.json
          git commit -q -m "Automated index build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin published-index
